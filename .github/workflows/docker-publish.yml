name: Build and Push Docker Image

run-name: Build & Push by @${{ github.actor }} (${{ github.ref_name }})

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: '빌드할 브랜치 또는 태그 (기본: main)'
        required: false
        default: 'main'
        type: string

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || github.ref }}

      # BuildKit 빌더 세팅 (v3 최신)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub 로그인 (TOKEN 또는 PASSWORD 둘 중 등록된 것으로 자동 대응)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

      # 태그 자동 생성: latest + 커밋 단축 SHA (v5 최신)
      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/my-space-frontend
          tags: |
            type=raw,value=latest,enable=${{ (inputs.branch || github.ref_name) == 'main' }}
            type=sha,format=short,prefix=sha-

      - name: Get current timestamp
        id: time
        run: echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      # BuildKit GHA 캐시 및 linux/amd64 빌드 & 푸시 (v6 최신)
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILD_TIME=${{ steps.time.outputs.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitOps: homelab-infra 저장소의 frontend 이미지 태그 자동 갱신
      - name: Checkout homelab-infra
        uses: actions/checkout@v5
        with:
          repository: 'lkh-space/homelab-infra'
          token: ${{ secrets.INFRA_DEPLOY_TOKEN || secrets.GH_PAT || secrets.PERSONAL_ACCESS_TOKEN }}
          path: 'homelab-infra'

      - name: Update frontend image tag in GitOps repo
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="sha-${SHORT_SHA}"
          echo "Updating frontend image tag to ${IMAGE_TAG}..."

          cd homelab-infra/k8s/apps/frontend
          sed -i.bak -E "s/(newTag:).*/\1 ${IMAGE_TAG}/" kustomization.yaml
          rm -f kustomization.yaml.bak

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(frontend): update image tag to ${IMAGE_TAG}"
            git pull --rebase origin main
            git push origin main
          fi
